[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "nfl-sos-ratings"
version = "0.1.0"
description = "Schedule-strength-adjusted NFL team and quarterback ratings from nflverse data."
keywords = ["stats", "sports", "football", "machine learning"]
readme = "README.md"
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.142",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "polars>=1.44",
    "uvicorn>=0.54",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
nfl-sos = "nfl_sos_ratings.main:main"
nfl-sos-pipeline = "nfl_sos_ratings.pipeline:main"
nfl-sos-ui-api = "nfl_sos_ratings.ui_api:main"

[project.urls]
Homepage = "https://github.com/mitch-avis/nfl-sos-ratings"

[dependency-groups]
dev = [
    "colorama>=0.4",
    "httpx2>=2.13",
    "pre-commit>=4.6",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12"

# The package sits at the repo root (flat layout), not under src/.
[tool.uv.build-backend]
module-root = ""

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "tests"]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "data",
    "web",
    "ui",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["nfl_sos_ratings"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # Conflicts with D211 (no-blank-line-before-class)
    "D213",   # Conflicts with D212 (multi-line-summary-first-line)
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "ISC001", # Conflicts with `ruff format`, which joins implicit concatenations
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI reads route signatures at runtime, so the types they name must stay real imports rather
# than moving under TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.get",
    "fastapi.APIRouter.get",
]

# `pl.lit(True)` builds a literal from a value; the boolean is data, not a behavior flag.
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["polars.lit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "ANN",     # fixtures/params don't need annotations everywhere
    "SLF001",  # tests may poke private helpers
    "INP001",  # tests/ is not a package
    "ARG001",  # fixtures and monkeypatched fakes keep the signature they replace
    "ARG002",
    "ARG005",
    "PLC0415", # tests may import inside a test to scope a monkeypatch
]
# Command-line progress and report output goes to stdout with print until a project logger
# replaces it in these modules.
"nfl_sos_ratings/main.py" = ["T201"]
"nfl_sos_ratings/pipeline.py" = ["T201"]
"nfl_sos_ratings/opponent_stats.py" = ["T201"]
"nfl_sos_ratings/composite_weights.py" = ["T201"]
"nfl_sos_ratings/validation/walk_forward.py" = ["T201"]
"nfl_sos_ratings/validation/qsos_audit.py" = ["T201"]

[tool.pyright]
pythonVersion = "3.14"
# The whole tree (package and tests) runs in standard mode with the extra rules promoted below;
# strict mode is not enabled for nfl_sos_ratings/.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonPlatform = "Linux"
stubPath = "stubs"
executionEnvironments = [{ root = "." }]
# --- Standard-mode diagnostics promoted to errors (also surfaced by Pylance) ----------
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportAttributeAccessIssue = "error"
reportAssignmentType = "error"
reportArgumentType = "error"
reportReturnType = "error"
reportCallIssue = "error"
reportIndexIssue = "error"
reportOperatorIssue = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportGeneralTypeIssues = "error"
reportMissingTypeStubs = false
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "--strict-markers",
    "--cov=nfl_sos_ratings",
    "--cov-report=term-missing",
]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["nfl_sos_ratings"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]
