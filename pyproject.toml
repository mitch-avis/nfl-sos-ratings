[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "nfl-sos-ratings"
version = "0.1.0"
description = "Schedule-strength-adjusted NFL team and quarterback ratings from nflverse data."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
keywords = ["stats", "sports", "football", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.162",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "polars>=2.0",
    "uvicorn>=0.54",
]

[project.scripts]
nfl-sos = "nfl_sos_ratings.cli:season_shortcut"
nfl-sos-pipeline = "nfl_sos_ratings.cli:pipeline_shortcut"
nfl-sos-ratings = "nfl_sos_ratings.cli:main"

[dependency-groups]
dev = [
    "colorama>=0.4",
    "httpx2>=2.16",
    "pre-commit>=4.7",
    "pre-commit-uv>=4.4.0",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "ty>=0.0.91",
]

[tool.uv]
required-version = ">=0.13"

# The package sits at the repo root (flat layout), not under src/.
[tool.uv.build-backend]
module-root = ""

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["nfl_sos_ratings", "tests"]
extend-exclude = ["build", "data", "web"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.isort]
known-first-party = ["nfl_sos_ratings"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI reads route signatures at runtime, so the types they name must stay real imports rather
# than moving under TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["fastapi.FastAPI.get", "fastapi.APIRouter.get"]

# `pl.lit(True)` builds a literal from a value; the boolean is data, not a behavior flag.
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["polars.lit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "ANN",     # fixtures/params don't need annotations everywhere
    "SLF001",  # tests may poke private helpers
    "INP001",  # tests/ is not a package
    "ARG001",  # fixtures and monkeypatched fakes keep the signature they replace
    "ARG002",
    "ARG005",
    "PLC0415", # tests may import inside a test to scope a monkeypatch
]
# Fixture builders print the values to pin in their tests.
"tests/fixtures/*/build_fixture.py" = ["T201"]

# --------------------------------------------------------------------------------------------
# Type checking: ty and pyright (strict)
# --------------------------------------------------------------------------------------------
[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"

[tool.ty.src]
include = ["nfl_sos_ratings", "tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
include = ["nfl_sos_ratings", "tests"]

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]           # keeps `tests.*` imports resolving from the repo root
reportPrivateUsage = false   # unit tests import their own module's private helpers
reportMissingTypeStubs = false  # nflreadpy and a few scientific dependencies ship without stubs.

[[tool.pyright.executionEnvironments]]
root = "."
reportMissingTypeStubs = false  # nflreadpy and a few scientific dependencies ship without stubs.

# --------------------------------------------------------------------------------------------
# Tests and coverage
# --------------------------------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# Tests import shared helpers as `tests.*`; the package itself is imported from src/ via the
# editable install, so bare `pytest` and `python -m pytest` resolve the same modules.
pythonpath = ["."]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids.
strict = true
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "-m",                        # generated-data checks stay opt-in on the default suite
    "not published_data",
    "-n=auto",                   # pytest-xdist: one worker per core; `-n 0` runs in-process
    "--cov",                     # measure the paths in [tool.coverage.run] source
    "--cov-report=term-missing",
]
markers = [
    "published_data: reads the generated Parquet outputs under data/; deselected by default",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["nfl_sos_ratings"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == \"__main__\":", "if TYPE_CHECKING:"]
