[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[project]
name = "nfl-sos-ratings"
version = "0.1.0"
description = "Schedule-strength-adjusted NFL team and quarterback ratings from nflverse data."
keywords = ["stats", "sports", "football", "machine learning"]
readme = "README.md"
authors = [{ name = "Mitch Avis", email = "mitchavis@gmail.com" }]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.142",
    "nflreadpy>=0.1",
    "numpy>=2.5",
    "polars>=1.44",
    "uvicorn>=0.54",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
nfl-sos-ratings = "nfl_sos_ratings.cli:main"
# Shortcuts kept for existing habits: `nfl-sos-ratings season` and `nfl-sos-ratings pipeline`.
# They go through the front door so they get its defaults (single-threaded BLAS).
nfl-sos = "nfl_sos_ratings.cli:season_shortcut"
nfl-sos-pipeline = "nfl_sos_ratings.cli:pipeline_shortcut"

[project.urls]
Homepage = "https://github.com/mitch-avis/nfl-sos-ratings"

[dependency-groups]
dev = [
    "colorama>=0.4",
    "httpx2>=2.13",
    "pre-commit>=4.6",
    "pre-commit-uv>=4.3.0",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
    "ty>=0.0.84",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12"

# The package sits at the repo root (flat layout), not under src/.
[tool.uv.build-backend]
module-root = ""

# --------------------------------------------------------------------------------------------
# Ruff: format + lint (strict)
# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "tests"]
extend-exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    "data",
    "web",
    "ui",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # Conflicts with D211 (no-blank-line-before-class)
    "D213",   # Conflicts with D212 (multi-line-summary-first-line)
    "COM812", # Conflicts with `ruff format`, which owns trailing commas
    "ISC001", # Conflicts with `ruff format`, which joins implicit concatenations
    "CPY001", # The license is declared once in pyproject.toml, not per file
]

[tool.ruff.lint.isort]
known-first-party = ["nfl_sos_ratings"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI reads route signatures at runtime, so the types they name must stay real imports rather
# than moving under TYPE_CHECKING.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.get",
    "fastapi.APIRouter.get",
]

# `pl.lit(True)` builds a literal from a value; the boolean is data, not a behavior flag.
[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["polars.lit"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "ANN",     # fixtures/params don't need annotations everywhere
    "SLF001",  # tests may poke private helpers
    "INP001",  # tests/ is not a package
    "ARG001",  # fixtures and monkeypatched fakes keep the signature they replace
    "ARG002",
    "ARG005",
    "PLC0415", # tests may import inside a test to scope a monkeypatch
]
# Fixture builders print the values to pin in their tests.
"tests/fixtures/*/build_fixture.py" = ["T201"]
# Command-line progress and report output goes to stdout with print until a project logger
# replaces it in these modules.
"nfl_sos_ratings/main.py" = ["T201"]
"nfl_sos_ratings/pipeline.py" = ["T201"]
"nfl_sos_ratings/validation/walk_forward.py" = ["T201"]

# --------------------------------------------------------------------------------------------
# Type checking: ty and pyright (strict)
# --------------------------------------------------------------------------------------------
[tool.ty.environment]
# Pin ty to the repo venv so local and CI checks resolve the same interpreter.
python = ".venv"
python-version = "3.14"

[tool.ty.src]
include = ["nfl_sos_ratings", "tests"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonPlatform = "Linux"
include = ["nfl_sos_ratings", "tests"]
exclude = ["**/__pycache__", "**/.*", ".venv", "**/node_modules", "data", "dist", "web", "ui"]
# Tests may call private helpers directly (ruff's SLF001 is off there for the same reason).
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
    { root = "." },
]
# nflreadpy and a few scientific dependencies ship without stubs.
reportMissingTypeStubs = false

# --------------------------------------------------------------------------------------------
# Tests and coverage
# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Tests import shared helpers as `tests.*`.
pythonpath = ["."]
addopts = [
    "-ra",                       # show extra summary for (s)kipped, (x)failed
    "--strict-markers",
    "--cov=nfl_sos_ratings",
    "--cov-report=term-missing",
    "-m", "not published_data",  # opt in with `pytest -m published_data`
]
markers = [
    "published_data: reads the generated Parquet outputs under data/; deselected by default",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["nfl_sos_ratings"]
omit = ["config.py", "config-*.py", "*/config.py", "*/config-*.py"]

[tool.coverage.report]
# The floor; the goal is 100%.
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == \"__main__\":"]
# Never run by design: typing-only imports, and the `...` body of a Protocol method.
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]
