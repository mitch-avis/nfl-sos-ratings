name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Create virtual environment and sync dependencies
        run: |
          uv venv .venv
          uv sync --locked

      - name: Set up Node.js for markdownlint
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2

      # The one gate: lock and sync checks, ruff format and lint, ty, pyright, pytest, every
      # front-door command's --help, and markdownlint, exactly as it runs locally. Tests marked
      # published_data are deselected by default, so no generated data/ is needed here.
      - name: Gate
        run: scripts/gate.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.8.1"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build
